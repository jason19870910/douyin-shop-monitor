version: "3.8"
services:
  monitor:
    build: "."
    container_name: douyin_monitor
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      # 外部 API 基础 URL
      - FXG_BASE_URL=https://fxg.jinritemai.com
      - CREATOR_BASE_URL=https://creator.douyin.com
      # 其他配置
      - ALERT_EMAIL=${ALERT_EMAIL}
      - SCHEDULE_INTERVAL_MINUTES=60
      - API_AUTH_TOKEN=${API_AUTH_TOKEN}
      - USER_AGENT=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36
      # Celery 配置
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - VIRTUAL_HOST=wlkj-tech.cn
      - VIRTUAL_PORT=5000
    secrets:
      - douyin_app_id
      - douyin_app_secret
      - douyin_access_token
      - fxg_cookies
      - creator_cookies
      - token
      - ms_token
      - a_bogus
      - verify_fp
      - fp
      - fxg_shop_id
      - fxg_log_id
      - api_key
    #volumes:
    #  - ./data:/data
    #  - ~/.cache:/root/.cache
    #  - ./app.py:/app/app.py
    #  - ./config.py:/app/config.py
    ports:
      - "5000:5000"
    command: gunicorn app:app --bind 0.0.0.0:5000 --workers 4 --timeout 60 --access-logfile - --error-logfile -
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Celery Worker
  celery_worker:
    build: "."
    container_name: douyin_celery_worker
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - FXG_BASE_URL=https://fxg.jinritemai.com
      - CREATOR_BASE_URL=https://creator.douyin.com
      - ALERT_EMAIL=${ALERT_EMAIL}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    secrets:
      - douyin_app_id
      - douyin_app_secret
      - douyin_access_token
      - fxg_cookies
      - creator_cookies
      - token
      - ms_token
      - a_bogus
      - verify_fp
      - fp
      - fxg_shop_id
      - fxg_log_id
    #volumes:
    #  - ./data:/data
    command: celery -A celery_config worker --loglevel=info --concurrency=2 --pool=prefork
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Celery Beat (定时任务)
  celery_beat:
    build: "."
    container_name: douyin_celery_beat
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - FXG_BASE_URL=https://fxg.jinritemai.com
      - CREATOR_BASE_URL=https://creator.douyin.com
      - ALERT_EMAIL=${ALERT_EMAIL}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    secrets:
      - douyin_app_id
      - douyin_app_secret
      - douyin_access_token
      - fxg_cookies
      - creator_cookies
      - token
      - ms_token
      - a_bogus
      - verify_fp
      - fp
      - fxg_shop_id
      - fxg_log_id
    #volumes:
    #  - ./data:/data
    command: celery -A celery_config beat --loglevel=info --scheduler celery.beat.PersistentScheduler
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M

  # Redis
  redis:
    image: docker.1ms.run/redis:7-alpine
    container_name: douyin_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

secrets:
  douyin_app_id:
    file: ./secrets/douyin_app_id.txt
  douyin_app_secret:
    file: ./secrets/douyin_app_secret.txt
  douyin_access_token:
    file: ./secrets/douyin_access_token.txt
  fxg_cookies:
    file: ./secrets/fxg_cookies.txt
  creator_cookies:
    file: ./secrets/creator_cookies.txt
  token:
    file: ./secrets/token.txt
  ms_token:
    file: ./secrets/ms_token.txt
  a_bogus:
    file: ./secrets/a_bogus.txt
  verify_fp:
    file: ./secrets/verify_fp.txt
  fp:
    file: ./secrets/fp.txt
  fxg_shop_id:
    file: ./secrets/fxg_shop_id.txt
  fxg_log_id:
    file: ./secrets/fxg_log_id.txt
  api_key:
    file: ./secrets/api_key.txt

volumes:
  redis_data: