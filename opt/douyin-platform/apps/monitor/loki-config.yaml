auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9095
ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  chunk_idle_period: 5m
  max_chunk_age: 1h
schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

directory:
  chunk_store_config:
    max_look_back_period: 0s
    sync_dir: /tmp/loki/chunks
  boltdb_shipper:
    active_index_directory: /tmp/loki/boltdb-shipper-active
    cache_location: /tmp/loki/boltdb-shipper-cache
    shared_store: filesystem
    cache_ttl: 24h
    resync_interval: 5m
    ship_interval: 30s
    ingester:
      max_chunk_size_bytes: 1048576
      max_chunk_age: 1h
"