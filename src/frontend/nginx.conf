# 前端 Docker 容器内部 Nginx 配置
# SSL 终止在宿主机 Nginx，容器内只处理 HTTP

server {
    listen 80;
    server_name localhost;

    # Docker 内嵌 DNS 解析器，TTL 10s 确保容器 IP 变更后自动刷新
    resolver 127.0.0.11 valid=10s ipv6=off;
    # 使用变量强制运行时解析，避免 nginx 启动时缓存 IP
    set $upstream_app http://app:5000;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # API 代理配置
    location /api/ {
        proxy_pass $upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header Authorization $http_authorization;

        # Handle OPTIONS preflight requests for CORS
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Mx-Token,Keep-Alive,Content-Type,Authorization';
            add_header 'Access-Control-Max-Age' 172800;
            add_header Content-Type 'text/plain; charset=UTF-8';
            return 204;
        }
    }

    # 前端路由 - 所有非 API 请求返回 index.html 让前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存 - 开发/调试期间禁用缓存，避免旧代码加载
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Favicon 处理
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    location = /favicon.svg {
        access_log off;
        return 204;
    }

    # index.html 禁用缓存 - 确保每次部署后浏览器获取最新入口（哈希资源文件名可安全强缓存）
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }
}