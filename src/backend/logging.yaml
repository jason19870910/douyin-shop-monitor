version: 1
disable_existing_loggers: false

formatters:
  json:
    (): pythonjsonlogger.jsonlogger.JsonFormatter
    format: "%(asctime)s %(name)s %(levelname)s %(module)s %(funcName)s %(lineno)d %(process)d %(thread)d %(message)s"
    rename_fields:
      asctime: timestamp
      name: logger
      levelname: level
      module: module
      funcName: function
      lineno: line
      process: process_id
      thread: thread_id
      message: message
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: json
    filename: logs/app.log
    maxBytes: 10485760  # 10 MB
    backupCount: 5
    encoding: utf8

loggers:
  app:
    level: DEBUG
    handlers: [console, file]
    propagate: no

  services.fetcher:
    level: DEBUG
    handlers: [console, file]
    propagate: no

  # silence verbose libraries
  urllib3:
    level: WARNING
  requests:
    level: WARNING
  apscheduler:
    level: WARNING

root:
  level: WARNING
  handlers: [console]