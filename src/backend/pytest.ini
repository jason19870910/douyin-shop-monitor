[pytest]
testpaths = ../tests/backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --cov=app
    --cov=blueprints
    --cov=services
    --cov=models
    --cov=utils
    --cov=config
    --cov=middleware
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
    --ignore=../tests/backend/integration
    --ignore=../tests/backend/contract
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (mocked external services)
    contract: API contract tests
    slow: Slow running tests

[tool:coverage:run]
branch = True
source = 
    app
    blueprints
    services
    models
    utils
    config
    middleware
omit = 
    */tests/*
    */migrations/*
    */__pycache__/*
    */.venv/*

[tool:coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING: