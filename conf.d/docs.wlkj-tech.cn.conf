server {
    listen 80;
    server_name docs.wlkj-tech.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/douyin-platform/docs;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://docs.wlkj-tech.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name docs.wlkj-tech.cn;

    ssl_certificate /etc/letsencrypt/live/docs.wlkj-tech.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.wlkj-tech.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/douyin-platform/docs;
    index index.html;
    autoindex off;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.md$ {
        default_type text/plain;
    }
}
