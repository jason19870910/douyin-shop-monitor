version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: douyin-monitor-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - monitor-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  monitor-network:
    external: true