# Root docker-compose.yml - 3-container simplified architecture
# Services: app (Flask + sync scheduler) + redis + frontend
# Replaces original 5-container setup (monitor + celery_worker + celery_beat + redis + frontend)

services:
  # ==========================================
  # 1. App: Flask API + Sync Scheduler
  #    Contains: Flask endpoints, fetcher logic, scheduled sync tasks
  #    Replaces: monitor + celery_worker + celery_beat
  # ==========================================
  app:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        APP_COMMIT: ${APP_COMMIT:-unknown}
        APP_BUILT_AT: ${APP_BUILT_AT:-}
    container_name: douyin_app
    restart: unless-stopped
    env_file:
      - ./config/.env
    environment:
      - DATA_DIR=/data
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - FXG_BASE_URL=https://fxg.jinritemai.com
      - CREATOR_BASE_URL=https://creator.douyin.com
      - ALERT_EMAIL=${ALERT_EMAIL}
      - OAUTH_REDIRECT_URI=https://wlkj-tech.cn/api/v1/auth/callback
      - SCHEDULE_INTERVAL_MINUTES=60
      - API_AUTH_TOKEN=${API_AUTH_TOKEN}
      - USER_AGENT=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
      - REDIS_HOST=redis
      - DEBUG=true
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    secrets:
      - douyin_app_id
      - douyin_app_secret
      - douyin_access_token
      - fxg_cookies
      - creator_cookies
      - token
      - ms_token
      - a_bogus
      - verify_fp
      - fp
      - fxg_shop_id
      - fxg_log_id
      - api_key
      - redirect_uri
    volumes:
      - ./src/backend:/app
    networks:
      - douyin-network

  # ==========================================
  # 2. Redis: Shared data store and distributed lock
  # ==========================================
  redis:
    image: docker.1ms.run/redis:7-alpine
    container_name: douyin_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - douyin-network

  # ==========================================
  # 3. Frontend: React + Nginx
  # ==========================================
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_KEY: ${VITE_API_KEY:-wlkj_douyin_api_20260921_abc123}
    container_name: douyin_frontend
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 256m
    ports:
      - "3000:80"
    depends_on:
      - app
    networks:
      - douyin-network
    env_file:
      - ./src/frontend/.env
    volumes:
      # 持久化 nginx 配置，避免容器重启后配置丢失
      # 将宿主机的 nginx.conf 挂载到容器内的默认配置位置
      - ./src/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

# ==========================================
# Networks
# ==========================================
networks:
  douyin-network:
    driver: bridge

# ==========================================
# Volumes
# ==========================================
volumes:
  redis_data:

# ==========================================
# Secrets
# ==========================================
secrets:
  douyin_app_id:
    file: ./secrets/douyin_app_id.txt
  douyin_app_secret:
    file: ./secrets/douyin_app_secret.txt
  douyin_access_token:
    file: ./secrets/douyin_access_token.txt
  fxg_cookies:
    file: ./secrets/fxg_cookies.txt
  creator_cookies:
    file: ./secrets/creator_cookies.txt
  token:
    file: ./secrets/token.txt
  ms_token:
    file: ./secrets/ms_token.txt
  a_bogus:
    file: ./secrets/a_bogus.txt
  verify_fp:
    file: ./secrets/verify_fp.txt
  fp:
    file: ./secrets/fp.txt
  fxg_shop_id:
    file: ./secrets/fxg_shop_id.txt
  fxg_log_id:
    file: ./secrets/fxg_log_id.txt
  api_key:
    file: ./secrets/api_key.txt
  redirect_uri:
    file: ./secrets/redirect_uri.txt