# 抖音电商数据监控平台 - 前端 Nginx 配置

server {
    listen 80;
    server_name monitor.wlkj-tech.cn;
    return 301 https://monitor.wlkj-tech.cn$request_uri;
}

server {
    listen 443 ssl http2;
    server_name monitor.wlkj-tech.cn;

    ssl_certificate /etc/letsencrypt/live/wlkj-tech.cn-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wlkj-tech.cn-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    # 前端静态文件直接由 Nginx 服务
    root /opt/douyin-platform/apps/monitor/frontend/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # API 请求代理到 Flask (5000)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200M;
    }
}