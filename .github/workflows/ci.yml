name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FRONTEND_DIR: src/frontend
  BACKEND_DIR: src/backend

jobs:
  cleanup-and-lint:
    name: Cleanup & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean backup files
        run: |
          find . -type f \( \
            -name "*.bak" -o -name "*.bak.*" -o \
            -name "*.old" -o -name "*.old.*" -o \
            -name "*~" -o \
            -name "*.dist" -o \
            -name "*.backup" -o \
            -name "*.orig" -o \
            -name "*.swp" -o \
            -name "*.tmp" -o \
            -name "*.temp" \
          \) -delete
          find . -type f -name "*.bak.*" -delete
          find . -type d -empty -delete 2>/dev/null || true
          echo "Cleanup completed"

      - name: Verify no backup files remain
        run: |
          files=$(find . -type f \( \
            -name "*.bak" -o -name "*.bak.*" -o \
            -name "*.old" -o -name "*.old.*" -o \
            -name "*~" -o \
            -name "*.dist" -o \
            -name "*.backup" -o \
            -name "*.orig" -o \
            -name "*.swp" -o \
            -name "*.tmp" -o \
            -name "*.temp" \
          \))
          if [ -n "$files" ]; then
            echo "Found backup files that should have been cleaned:"
            echo "$files"
            exit 1
          fi
          echo "No backup files found - cleanup verified"

      - name: Verify no npm pollution in root
        run: |
          npm_files=$(find . -maxdepth 1 -type f \( \
            -name "*.js" -o -name "*.ts" -o -name "*.tsx" -o -name "*.jsx" \
          \) | head -5)
          if [ -n "$npm_files" ]; then
            echo "Found npm pollution files in root:"
            echo "$npm_files"
            exit 1
          fi
          echo "No npm pollution in root - verified"

      - name: Verify no sensitive files in root
        run: |
          sensitive=$(find . -maxdepth 1 -type f \( \
            -name "*.env" -o -name "*.key" -o -name "*.pem" -o \
            -name "*.cert" -o -name "credentials*" \
          \) | head -5)
          if [ -n "$sensitive" ]; then
            echo "Found sensitive files in root:"
            echo "$sensitive"
            exit 1
          fi
          echo "No sensitive files in root - verified"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Lint backend
        working-directory: ${{ env.BACKEND_DIR }}
        run: ruff check . && ruff format --check .
        continue-on-error: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Lint frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npx eslint src/ || true

      - name: Check formatting
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,json,css,md}" || true

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: cleanup-and-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run backend tests
        run: pytest -c pytest.ini -v --tb=short

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Run frontend tests
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npx vitest run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install and build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          npm ci
          npm run build

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ${{ env.FRONTEND_DIR }}/build/
          retention-days: 7
