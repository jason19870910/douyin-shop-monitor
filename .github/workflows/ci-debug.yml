name: CI Debug

on:
  push:
    branches: [main, master]

jobs:
  debug:
    name: Debug Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: src/backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest diagnostics
        run: |
          set +e
          {
            python -V
            which python pytest
            python -c "import sys; print(sys.executable)"
          } > ver.log 2>&1
          pytest -c pytest.ini --collect-only -q --tb=short > collect.log 2>&1
          echo "COLLECT_EXIT=$?" >> ver.log
          pytest -c pytest.ini --tb=short > run.log 2>&1
          echo "RUN_EXIT=$?" >> ver.log
          cat ver.log > diag.log
          echo "=== collect.log ===" >> diag.log
          cat collect.log >> diag.log
          tail -c 2200 collect.log > ann.txt
          while IFS= read -r line; do echo "::error::$line"; done < ann.txt
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            diag.log
            collect.log
            run.log
          retention-days: 3
