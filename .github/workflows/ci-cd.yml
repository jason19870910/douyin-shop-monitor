name: CI/CD - Build & Deploy

on:
  push:
    branches: [main]
    tags: ['v*']  # 语义化版本标签触发
  workflow_dispatch:  # 手动触发

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOY_PATH: /opt/douyin-platform

jobs:
  # ==================== 1. 生成版本信息 ====================
  version:
    name: Generate Version Info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gen.outputs.version }}
      commit: ${{ steps.gen.outputs.commit }}
      built_at: ${{ steps.gen.outputs.built_at }}
      is_release: ${{ steps.gen.outputs.is_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史用于生成 changes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate version info
        id: gen
        run: |
          python scripts/generate_version_info.py
          VERSION=$(cat src/backend/data/version_info.json | jq -r .version)
          COMMIT=$(cat src/backend/data/version_info.json | jq -r .commit)
          BUILT_AT=$(cat src/backend/data/version_info.json | jq -r .builtAt)
          
          # 如果是 tag 触发，优先使用 tag 作为版本号
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "built_at=$BUILT_AT" >> $GITHUB_OUTPUT

      - name: Upload version files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: version-files
          path: |
            src/backend/data/version_info.json
            src/backend/data/changes_info.json

  # ==================== 2. 构建后端镜像 ====================
  # 注意：ghcr 镜像仅作存档/审计，不参与服务器拉起（见 deploy job 注释）。
  # 仓库若禁止 GITHUB_TOKEN 创建 package，此 job 失败不影响部署，故 continue-on-error。
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: version
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download version files
        uses: actions/download-artifact@v4
        with:
          name: version-files
          path: src/backend/data/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend
          file: ./src/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 3. 构建前端镜像 ====================
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: version
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Frontend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_KEY=${{ secrets.VITE_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 4. 部署到服务器 ====================
  # 部署模式与 scripts/deploy.sh 一致：服务器本地 docker compose build + up -d
  # （build-backend/build-frontend 推送的 ghcr 镜像仅作存档/审计，不参与服务器拉起，
  #   故 deploy 不依赖镜像 job，镜像构建失败不会阻断部署）
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [version]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    env:
      SSH_HOST: ${{ secrets.SERVER_HOST }}
      SSH_USER: ${{ secrets.SERVER_USER }}
    # 注意：ssh/scp 选项一律在 run 脚本里内联展开。
    # 不要改成 $SSH_CMD 之类的变量间接引用——bash 不会对变量值里的
    # $HOME / ~ 做二次展开，ssh 会拿到字面路径导致“零身份认证”失败。
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 保留上一提交对象：回滚需要 git archive HEAD~1:src/backend

      - name: Download version files
        uses: actions/download-artifact@v4
        with:
          name: version-files
          path: src/backend/data/

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # 私钥写入专用文件（不依赖 ssh-agent，agent 身份曾出现不可用）
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          # 校验私钥可解析并打印指纹，便于与服务器 authorized_keys 比对
          ssh-keygen -y -f ~/.ssh/id_ci > /dev/null
          echo "CI key fingerprint: $(ssh-keygen -lf ~/.ssh/id_ci)"

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -T 10 -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy deployment files to server
        run: |
          ssh -i ~/.ssh/id_ci -o BatchMode=yes -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              $SSH_USER@$SSH_HOST "mkdir -p ${{ env.DEPLOY_PATH }}/data"
          scp -i ~/.ssh/id_ci -o BatchMode=yes -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              docker-compose.yml \
              $SSH_USER@$SSH_HOST:${{ env.DEPLOY_PATH }}/docker-compose.yml
          scp -i ~/.ssh/id_ci -o BatchMode=yes -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              src/backend/data/version_info.json src/backend/data/changes_info.json \
              $SSH_USER@$SSH_HOST:${{ env.DEPLOY_PATH }}/data/
          # src/frontend/nginx.conf 虽在 .gitignore 白名单中被跟踪，但它是
          # bind mount 到容器的运行配置且服务器上是调优过的定制版，不随本步
          # 分发；Sync frontend source 步同步前端代码时同样排除它
          # （改 nginx 配置时需手动同步）。

      # app 容器 bind mount ./src/backend:/app，后端代码必须随部署同步；
      # 用 git archive 只同步 git 跟踪的代码文件，避免覆盖服务器上的
      # 运行时数据（data/*.json 被 gitignore，不会出现在归档中）。
      # 覆盖前先把当前 src/backend 打成 src_backend_prev.tar，回滚时用于
      # 恢复宿主机源码（deploy.sh --rollback 的手动路径，服务器无 .git）。
      - name: Sync backend source to server
        run: |
          # 归档条目相对于 src/backend，直接解包到服务器上的 src/backend；
          # 先快照旧源码再解包新源码（tar 失败不阻断，首次部署目录为空）
          git archive --format=tar HEAD:src/backend \
            | ssh -i ~/.ssh/id_ci -o BatchMode=yes -o IdentitiesOnly=yes \
                -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
                $SSH_USER@$SSH_HOST \
                "mkdir -p ${{ env.DEPLOY_PATH }}/src/backend && cd ${{ env.DEPLOY_PATH }} && tar -cf src_backend_prev.tar -C src/backend . 2>/dev/null; tar -x -C src/backend -f -"
          # Windows 仓库 git 不记录执行位，归档解包得到 644，重启前补回 +x
          ssh -i ~/.ssh/id_ci -o BatchMode=yes -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              $SSH_USER@$SSH_HOST \
              "cd ${{ env.DEPLOY_PATH }} && chmod +x src/backend/entrypoint.sh && docker compose restart app"

      # frontend 的编译产物 dist 烤进镜像（compose 只挂 nginx.conf，不挂 dist），
      # docker compose build frontend 以服务器 ./src/frontend 为 build context。
      # deploy job 此前只同步 backend，服务器上的前端源码一直停留在手动同步
      # 时的版本，前端代码更新永远进不了生产镜像（bundle 不含新代码）。
      # 用 git archive 同步 git 跟踪的前端源码；nginx.conf 已在上面说明：
      # 它是 bind mount 运行配置且服务器上是定制版，解包时显式排除，
      # 避免覆盖线上 nginx 配置。
      - name: Sync frontend source to server
        run: |
          git archive --format=tar HEAD:src/frontend \
            | ssh -i ~/.ssh/id_ci -o BatchMode=yes -o IdentitiesOnly=yes \
                -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
                $SSH_USER@$SSH_HOST \
                "mkdir -p ${{ env.DEPLOY_PATH }}/src/frontend && tar -x -C ${{ env.DEPLOY_PATH }}/src/frontend --exclude=nginx.conf -f -"

      - name: Configure server .env (compose interpolation)
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          API_AUTH_TOKEN: ${{ secrets.API_AUTH_TOKEN }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
        run: |
          DEPLOY_TIME=$(date -Iseconds)
          # 增量更新：只覆盖这 4 个插值变量，保留服务器 .env 中已有的
          # 抖音/抖店 cookies 等其余配置（整体 cat > 会清空它们）
          ssh -i ~/.ssh/id_ci -o BatchMode=yes -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              $SSH_USER@$SSH_HOST "cd ${{ env.DEPLOY_PATH }} && touch .env && set_kv () { grep -q \"^\$1=\" .env && sed -i \"s|^\$1=.*|\$1=\$2|\" .env || echo \"\$1=\$2\" >> .env; }; set_kv ALERT_EMAIL \"$ALERT_EMAIL\"; set_kv API_AUTH_TOKEN \"$API_AUTH_TOKEN\"; set_kv VITE_API_KEY \"$VITE_API_KEY\"; set_kv LAST_DEPLOY_TIME \"$DEPLOY_TIME\"; grep -E '^(ALERT_EMAIL|API_AUTH_TOKEN|VITE_API_KEY|LAST_DEPLOY_TIME)=' .env"

      - name: Backup current images for rollback
        run: |
          ssh -i ~/.ssh/id_ci -o BatchMode=yes -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              $SSH_USER@$SSH_HOST \
              "docker tag douyin-platform-app:latest douyin-platform-app:prev 2>/dev/null || true; docker tag douyin-platform-frontend:latest douyin-platform-frontend:prev 2>/dev/null || true"

      - name: Build and deploy on server
        run: |
          ssh -i ~/.ssh/id_ci -o BatchMode=yes -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              $SSH_USER@$SSH_HOST \
              "cd ${{ env.DEPLOY_PATH }} && docker compose build app frontend && docker compose up -d && docker compose ps"

      - name: Health check with auto rollback
        run: |
          # 探测失败时执行完整回滚：回退 :prev 镜像 tag + 回退宿主机 src/backend
          # 源码到上一提交 + 确定性重建容器 + 镜像 ID 断言。
          # 回退源码的原因：app 容器 bind mount ./src/backend:/app，宿主机源码
          # 变更即时生效且不随镜像回退，只回滚镜像时新代码引起的故障依旧存在。
          if ssh -i ~/.ssh/id_ci -o BatchMode=yes -o IdentitiesOnly=yes \
                 -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
                 $SSH_USER@$SSH_HOST 'bash -s' << 'PROBE'
          ok=0
          for i in $(seq 1 12); do
            if curl -sf http://127.0.0.1:5000/api/v1/health >/dev/null 2>&1 \
               && curl -sf http://127.0.0.1:3000/health >/dev/null 2>&1; then
              ok=1
              break
            fi
            echo "waiting for services... ($i)"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            exit 1
          fi
          echo "health checks passed"
          PROBE
          then
            echo "[health-check] all healthy, no rollback needed"
            exit 0
          fi

          echo "[rollback] health check failed, starting full rollback"
          # 1) 回退宿主机 src/backend 源码到上一提交（fetch-depth: 2 保证 HEAD~1 可用）
          PREV_COMMIT=$(git rev-parse HEAD~1 2>/dev/null || true)
          if [ -n "$PREV_COMMIT" ]; then
            echo "[rollback] restoring src/backend from $PREV_COMMIT"
            git archive --format=tar "$PREV_COMMIT":src/backend \
              | ssh -i ~/.ssh/id_ci -o BatchMode=yes -o IdentitiesOnly=yes \
                  -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
                  $SSH_USER@$SSH_HOST \
                  "mkdir -p ${{ env.DEPLOY_PATH }}/src/backend && tar -x -C ${{ env.DEPLOY_PATH }}/src/backend -f -"
            # Windows 仓库 git 不记录执行位，归档解包得到 644，补回 +x
            ssh -i ~/.ssh/id_ci -o BatchMode=yes -o IdentitiesOnly=yes \
                -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
                $SSH_USER@$SSH_HOST \
                "cd ${{ env.DEPLOY_PATH }} && chmod +x src/backend/entrypoint.sh"
          else
            echo "[rollback] no previous commit available, source kept as-is"
          fi
          # 2) 回退镜像 tag、确定性重建容器（--force-recreate 防 compose 判定无变化时空转）、
          #    回滚后断言：运行中的容器镜像必须等于各自 :prev 镜像
          ROLLBACK_RC=0
          ssh -i ~/.ssh/id_ci -o BatchMode=yes -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              $SSH_USER@$SSH_HOST 'bash -s' << 'RB' || ROLLBACK_RC=1
          cd ${{ env.DEPLOY_PATH }}
          docker tag douyin-platform-app:prev douyin-platform-app:latest 2>/dev/null || true
          docker tag douyin-platform-frontend:prev douyin-platform-frontend:latest 2>/dev/null || true
          docker compose up -d --no-build
          docker compose up -d --no-build --force-recreate --no-deps frontend
          APP_IMG=$(docker inspect -f {{.Image}} douyin_app)
          PREV_APP_IMG=$(docker inspect -f {{.Image}} douyin-platform-app:prev)
          FE_IMG=$(docker inspect -f {{.Image}} douyin_frontend)
          PREV_FE_IMG=$(docker inspect -f {{.Image}} douyin-platform-frontend:prev)
          echo "[rollback] app image=$APP_IMG prev=$PREV_APP_IMG"
          echo "[rollback] frontend image=$FE_IMG prev=$PREV_FE_IMG"
          if [ "$APP_IMG" != "$PREV_APP_IMG" ]; then
            echo "[rollback] assertion FAILED: app container is not running prev image"
            exit 1
          fi
          if [ "$FE_IMG" != "$PREV_FE_IMG" ]; then
            echo "[rollback] assertion FAILED: frontend container is not running prev image"
            exit 1
          fi
          echo "[rollback] image assertions passed"
          RB
          if [ "$ROLLBACK_RC" != "0" ]; then
            echo "[rollback] rollback FAILED or assertions failed, manual intervention required"
          else
            echo "[rollback] rollback completed and verified"
          fi
          # 部署失败：无论回滚是否成功，最终都以非零退出让 CI 标红
          exit 1

      - name: Record deployed image id (for version page)
        run: |
          # 部署成功后把当前 app 容器实际镜像 ID 写入宿主机 data/image_info.json，
          # 供版本页"运行镜像"展示真实镜像。version_info.json 是 bind mount 文件、
          # 不随镜像回退；回滚后 imageId 与 version 不一致即可识别镜像已回退。
          ssh -i ~/.ssh/id_ci -o BatchMode=yes -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              $SSH_USER@$SSH_HOST 'bash -s' << 'EOF'
          IMAGE_ID=$(docker inspect -f {{.Image}} douyin_app)
          cat > ${{ env.DEPLOY_PATH }}/data/image_info.json <<JSON
          {"imageId": "$IMAGE_ID", "recordedAt": "$(date -Iseconds)"}
          JSON
          echo "[record-image] $IMAGE_ID"
          EOF

  # ==================== 5. 通知 ====================
  notify:
    name: Notify Result
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
      - name: Send notification
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          # 可在此添加钉钉/飞书/企业微信通知
          # curl -X POST ${{ secrets.WEBHOOK_URL }} -d '{"msg":"Deployment failed"}'

      - name: Success notification
        if: success()
        run: |
          echo "✅ Deployment successful!"
          # curl -X POST ${{ secrets.WEBHOOK_URL }} -d '{"msg":"Deployment successful"}'