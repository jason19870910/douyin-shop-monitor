name: CI/CD - Build & Deploy

on:
  push:
    branches: [main]
    tags: ['v*']  # 语义化版本标签触发
  workflow_dispatch:  # 手动触发

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  DEPLOY_PATH: /opt/douyin-platform

jobs:
  # ==================== 1. 生成版本信息 ====================
  version:
    name: Generate Version Info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gen.outputs.version }}
      commit: ${{ steps.gen.outputs.commit }}
      built_at: ${{ steps.gen.outputs.built_at }}
      is_release: ${{ steps.gen.outputs.is_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史用于生成 changes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate version info
        id: gen
        run: |
          python scripts/generate_version_info.py
          VERSION=$(cat src/backend/data/version_info.json | jq -r .version)
          COMMIT=$(cat src/backend/data/version_info.json | jq -r .commit)
          BUILT_AT=$(cat src/backend/data/version_info.json | jq -r .builtAt)
          
          # 如果是 tag 触发，优先使用 tag 作为版本号
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "built_at=$BUILT_AT" >> $GITHUB_OUTPUT

      - name: Upload version files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: version-files
          path: |
            src/backend/data/version_info.json
            src/backend/data/changes_info.json

  # ==================== 2. 构建后端镜像 ====================
  # 注意：ghcr 镜像仅作存档/审计，不参与服务器拉起（见 deploy job 注释）。
  # 仓库若禁止 GITHUB_TOKEN 创建 package，此 job 失败不影响部署，故 continue-on-error。
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: version
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download version files
        uses: actions/download-artifact@v4
        with:
          name: version-files
          path: src/backend/data/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend
          file: ./src/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 3. 构建前端镜像 ====================
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: version
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Frontend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_KEY=${{ secrets.VITE_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 4. 部署到服务器 ====================
  # 部署模式与 scripts/deploy.sh 一致：服务器本地 docker compose build + up -d
  # （build-backend/build-frontend 推送的 ghcr 镜像仅作存档/审计，不参与服务器拉起，
  #   故 deploy 不依赖镜像 job，镜像构建失败不会阻断部署）
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [version]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download version files
        uses: actions/download-artifact@v4
        with:
          name: version-files
          path: src/backend/data/

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Copy deployment files to server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p ${{ env.DEPLOY_PATH }}/data"
          scp docker-compose.yml \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ env.DEPLOY_PATH }}/docker-compose.yml
          scp src/backend/data/version_info.json src/backend/data/changes_info.json \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ env.DEPLOY_PATH }}/data/
          # src/frontend/nginx.conf 被 .gitignore 忽略，不随仓库分发，
          # 保持服务器现有挂载文件即可（改 nginx 配置时需手动同步）。

      # app 容器 bind mount ./src/backend:/app，后端代码必须随部署同步；
      # 用 git archive 只同步 git 跟踪的代码文件，避免覆盖服务器上的
      # 运行时数据（data/*.json 被 gitignore，不会出现在归档中）。
      - name: Sync backend source to server
        run: |
          git archive --format=tar HEAD:src/backend \
            | ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "tar -x --strip-components=1 -C ${{ env.DEPLOY_PATH }} -f -"
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && docker compose restart app"

      - name: Configure server .env (compose interpolation)
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          API_AUTH_TOKEN: ${{ secrets.API_AUTH_TOKEN }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
        run: |
          DEPLOY_TIME=$(date -Iseconds)
          # 增量更新：只覆盖这 4 个插值变量，保留服务器 .env 中已有的
          # 抖音/抖店 cookies 等其余配置（整体 cat > 会清空它们）
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "cd ${{ env.DEPLOY_PATH }} && touch .env && set_kv () { grep -q \"^\$1=\" .env && sed -i \"s|^\$1=.*|\$1=\$2|\" .env || echo \"\$1=\$2\" >> .env; }; set_kv ALERT_EMAIL $ALERT_EMAIL; set_kv API_AUTH_TOKEN $API_AUTH_TOKEN; set_kv VITE_API_KEY $VITE_API_KEY; set_kv LAST_DEPLOY_TIME $DEPLOY_TIME; grep -E '^(ALERT_EMAIL|API_AUTH_TOKEN|VITE_API_KEY|LAST_DEPLOY_TIME)=' .env"

      - name: Backup current images for rollback
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "docker tag douyin_platform-app:latest douyin_platform-app:prev 2>/dev/null || true; docker tag douyin_platform-frontend:latest douyin_platform-frontend:prev 2>/dev/null || true"

      - name: Build and deploy on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && docker compose build app frontend && docker compose up -d && docker compose ps"

      - name: Health check with auto rollback
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'bash -s' << 'EOF'
          set -e
          ok=0
          for i in $(seq 1 12); do
            if curl -sf http://127.0.0.1:5000/api/v1/health >/dev/null 2>&1 \
               && curl -sf http://127.0.0.1:3000/health >/dev/null 2>&1; then
              ok=1
              break
            fi
            echo "waiting for services... ($i)"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "health check failed, rolling back to prev images"
            docker tag douyin_platform-app:prev douyin_platform-app:latest || true
            docker tag douyin_platform-frontend:prev douyin_platform-frontend:latest || true
            cd /opt/douyin-platform
            docker compose up -d --no-build
            exit 1
          fi
          echo "health checks passed"
          EOF

  # ==================== 5. 通知 ====================
  notify:
    name: Notify Result
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
      - name: Send notification
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          # 可在此添加钉钉/飞书/企业微信通知
          # curl -X POST ${{ secrets.WEBHOOK_URL }} -d '{"msg":"Deployment failed"}'

      - name: Success notification
        if: success()
        run: |
          echo "✅ Deployment successful!"
          # curl -X POST ${{ secrets.WEBHOOK_URL }} -d '{"msg":"Deployment successful"}'