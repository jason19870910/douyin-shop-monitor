name: Docs Quality Check

on:
  pull_request:
    paths:
      - 'docs/**/*.md'
      - 'docs/.vitepress/**'
      - 'docs/package.json'
      - 'docs/scripts/**'
      - 'docs/cspell.json'
      - 'docs/.markdownlint.json'
  push:
    branches: [main, develop]
    paths:
      - 'docs/**/*.md'
      - 'docs/.vitepress/**'
      - 'docs/package.json'
      - 'docs/scripts/**'
      - 'docs/cspell.json'
      - 'docs/.markdownlint.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Markdown Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json
      
      - name: Install dependencies
        working-directory: docs
        run: npm ci
      
      - name: Run markdownlint
        working-directory: docs
        run: npx markdownlint-cli2 "**/*.md" --config .markdownlint.json
      
      - name: Run cspell
        working-directory: docs
        run: npx cspell "**/*.md" --config cspell.json --no-progress
      
      - name: Check Frontmatter
        working-directory: docs
        run: python scripts/validate_frontmatter.py
      
      - name: Check Links
        working-directory: docs
        run: python scripts/check_links.py

  build-preview:
    name: Build Documentation Preview
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json
      
      - name: Install dependencies
        working-directory: docs
        run: npm ci
      
      - name: Build VitePress
        working-directory: docs
        run: npm run docs:build
      
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: docs/.vitepress/dist
          retention-days: 7
      
      - name: Comment PR with preview link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📚 文档预览已构建完成！下载 Artifacts 中的 `docs-preview` 查看。'
            })

  generate-index:
    name: Generate Document Index
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        working-directory: docs/scripts
        run: pip install -r requirements.txt
      
      - name: Generate INDEX.md
        working-directory: docs
        run: python scripts/generate_index.py
      
      - name: Commit INDEX.md if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: auto-generate INDEX.md [skip ci]'
          file_pattern: docs/INDEX.md
          commit_options: '--no-verify'

  deploy-preview:
    name: Deploy Preview to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, build-preview]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download preview artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-preview
          path: ./docs-preview
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-preview
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: Notify on Failure
    if: failure()
    needs: [lint, build-preview, generate-index]
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        run: |
          echo "::error::文档质量检查失败，请查看 Actions 日志详情"
          # 这里可以集成企业微信/钉钉/飞书通知
          # curl -X POST "${{ secrets.WECOM_WEBHOOK }}" -d '{"msgtype":"text","text":{"content":"文档质量检查失败"}}'
EOF